# =============================================================================
# sage-kahoot-api — TEMPLATE do Secret. NÃO aplicar este arquivo como está.
#
# Ele é deliberadamente separado do k8sdeploy.yml: aplicar um Secret com
# placeholders junto dos manifests faria cada `kubectl apply` sobrescrever a
# senha do admin e a chave de assinatura por "PLACEHOLDER", derrubando a
# autenticação no primeiro redeploy. O k8sdeploy.yml é reaplicável à vontade;
# o Secret é criado uma vez.
#
# FORMA RECOMENDADA — sem arquivo intermediário, nada toca o disco:
#
#   kubectl -n {{NAMESPACE_K8S}} create secret generic sage-kahoot-api-secret \
#     --from-literal=Mongo__ConnectionString='mongodb://<host>:27017' \
#     --from-literal=Auth__AdminUsername='<usuario>' \
#     --from-literal=Auth__AdminPassword='<senha>' \
#     --from-literal=Auth__SigningKey='<chave com no minimo 32 bytes>'
#
# Para rotacionar uma credencial depois:
#
#   kubectl -n {{NAMESPACE_K8S}} create secret generic sage-kahoot-api-secret \
#     --from-literal=... --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n {{NAMESPACE_K8S}} rollout restart deployment/sage-kahoot-api
#
# SE PREFERIR PARTIR DESTE ARQUIVO: copie para secret.yml (já ignorado pelo
# git), substitua os placeholders e aplique a cópia — nunca este original.
#
#   cp deploy/k8s/secret.example.yml deploy/k8s/secret.yml
#   # editar secret.yml
#   kubectl -n {{NAMESPACE_K8S}} apply -f deploy/k8s/secret.yml
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sage-kahoot-api-secret
  namespace: "{{NAMESPACE_K8S}}"
  labels:
    app.kubernetes.io/name: sage-kahoot-api
    app.kubernetes.io/part-of: sage-kahoot
type: Opaque
stringData:
  # Instância de MongoDB fora do cluster (local ou container no servidor).
  Mongo__ConnectionString: "PLACEHOLDER"

  # Credencial única do apresentador. Não existe valor padrão na aplicação:
  # sem estas chaves o processo falha na inicialização nomeando a que faltou.
  Auth__AdminUsername: "PLACEHOLDER"
  Auth__AdminPassword: "PLACEHOLDER"

  # Mínimo de 32 bytes para HS256; abaixo disso a aplicação não sobe.
  Auth__SigningKey: "PLACEHOLDER"
