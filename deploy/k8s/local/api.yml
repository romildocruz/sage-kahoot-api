# =============================================================================
# sage-kahoot-api — deploy LOCAL (k3s no WSL, ingress Traefik)
#
# Gerado a partir de ../k8sdeploy.yml com os placeholders preenchidos para o
# ambiente local. Diferenças em relação ao deploy interno:
#   - imagem local (docker.io/library/sage-kahoot-api:local), sem registry;
#   - Swagger habilitado;
#   - sem Ingress aqui: o roteamento por caminho está em ingress.yml.
# Passo a passo completo (build, import da imagem, Mongo e Secret): README.md.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sage-kahoot-api-config
  namespace: "sage-kahoot"
  labels:
    app.kubernetes.io/name: sage-kahoot-api
    app.kubernetes.io/part-of: sage-kahoot
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Mongo__Database: "sage_kahoot"
  Mongo__HealthCheckTimeoutMs: "2000"
  # Sem efeito prático no local: web e API ficam na mesma origem (ingress.yml).
  # Ajustar se o IP do WSL mudar e o frontend passar a ser servido de outra origem.
  Cors__AllowedOrigins__0: "http://172.30.59.11"
  Session__MaxParticipants: "100"
  Session__AnswerToleranceMs: "500"
  Session__AbandonedAfterHours: "4"
  RateLimiting__LoginPermitLimit: "5"
  RateLimiting__LoginWindowSeconds: "60"
  RateLimiting__JoinPermitLimit: "20"
  RateLimiting__JoinWindowSeconds: "60"
  # Habilitado só no local; no deploy interno segue desabilitado (design.md, Open Questions 4).
  Swagger__Enabled: "true"
  Seed__Enabled: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sage-kahoot-api
  namespace: "sage-kahoot"
  labels:
    app.kubernetes.io/name: sage-kahoot-api
    app.kubernetes.io/part-of: sage-kahoot
spec:
  # Obrigatoriamente 1: o SignalR roda sem backplane, então duas instâncias quebrariam
  # a entrega de eventos das sessões ao vivo.
  replicas: 1
  strategy:
    # Recreate, e não RollingUpdate, para nunca haver duas instâncias simultâneas.
    # Consequência assumida: o deploy derruba sessões em andamento — fazer fora do
    # horário de treinamento.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sage-kahoot-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sage-kahoot-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "docker.io/library/sage-kahoot-api:local"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sage-kahoot-api-config
            - secretRef:
                name: sage-kahoot-api-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            # Fica negativa enquanto o MongoDB estiver inacessível ou os índices não
            # tiverem sido criados; o pod não recebe tráfego até lá.
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # Dimensionamento modesto: dezenas de participantes por sessão, não milhares.
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem exige um destino gravável para arquivos temporários.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sage-kahoot-api
  namespace: "sage-kahoot"
  labels:
    app.kubernetes.io/name: sage-kahoot-api
spec:
  # ClusterIP: sem exposição pública. O acesso vem do Ingress interno ou de port-forward.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sage-kahoot-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
