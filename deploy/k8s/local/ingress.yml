# Local (k3s/Traefik): tudo na mesma origem, roteado por caminho. Sem host => responde em qualquer IP/host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sage-kahoot-api
  namespace: sage-kahoot
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - { path: /api,     pathType: Prefix, backend: { service: { name: sage-kahoot-api, port: { name: http } } } }
          - { path: /hubs,    pathType: Prefix, backend: { service: { name: sage-kahoot-api, port: { name: http } } } }
          - { path: /swagger, pathType: Prefix, backend: { service: { name: sage-kahoot-api, port: { name: http } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sage-kahoot-web
  namespace: sage-kahoot
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: sage-kahoot-web, port: { name: http } } } }
